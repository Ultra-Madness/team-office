<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Team Office</title>
    <style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#111827;-webkit-tap-highlight-color:transparent}
html[data-theme=dark] body{background:#0f1115;color:#f3f4f6}
.of-plbl{display:none}
@media (max-width:700px){
  #root text.of-lbl{display:none}
  .of-plbl{display:flex;flex-direction:column;align-items:center;position:absolute;transform:translateX(-50%);width:22%;background:#fff;border:2px solid;border-radius:6px;padding:3px 3px;font-family:system-ui,sans-serif;line-height:1.15;text-align:center;z-index:3;cursor:pointer}
  .of-plbl b{font-size:13px;color:#111827}
  .of-plbl span{font-size:10.5px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .of-plbl i{display:none!important;font-style:normal;font-size:8.5px;color:#374151;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .of-card{position:fixed!important;left:8px!important;right:8px!important;bottom:8px!important;top:auto!important;transform:none!important;width:auto!important;max-width:none!important;max-height:55vh;overflow:auto;z-index:20!important}
}
</style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
